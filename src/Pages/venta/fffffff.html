<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Venta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#2d3440;
            padding:50px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .btn-menu{
            background:#4c84ff;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            color:white;
            font-weight:bold;
        }

        .btn-menu:hover{
            background:#3d6fe0;
        }

        .venta-menu{
            min-width:280px;
            background:#343b48;
            border-radius:12px;
            border:1px solid #4b5565;
            overflow:hidden;
            padding:6px 0;
            box-shadow:0 8px 25px rgba(0,0,0,.35);
        }

        .venta-menu .menu-title{
            font-size:11px;
            font-weight:700;
            color:#8fa3bf;
            padding:10px 16px 5px;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .venta-menu .dropdown-item{
            color:#ffffff;
            padding:11px 16px;
            font-size:14px;
            transition:all .2s ease;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .venta-menu .dropdown-item:hover{
            background:#424b5c;
            padding-left:20px;
        }

        .venta-menu .dropdown-item i{
            width:20px;
            text-align:center;
            font-size:15px;
        }

        .venta-menu .dropdown-divider{
            border-top:1px solid #4b5565;
            margin:6px 0;
        }

        .text-blue{
            color:#4da3ff;
        }

        .text-green{
            color:#59d98e;
        }

        .text-yellow{
            color:#ffcc66;
        }

        .text-red{
            color:#ff6b6b;
        }

        .text-gray{
            color:#cfd6e4;
        }

    </style>
</head>

<body>

    <div class="dropdown">

        <button class="btn-menu dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown">

            <i class="fas fa-ellipsis-v"></i>
            Opciones
        </button>

        <div class="dropdown-menu venta-menu show">

            <!-- FACTURACIÓN -->
            <div class="menu-title">
                <i class="fas fa-file-invoice-dollar"></i>
                Facturación
            </div>

            <a class="dropdown-item" href="#">
                <i class="fas fa-print text-blue"></i>
                Imprimir factura (Hoja carta)
            </a>

            <a class="dropdown-item" href="#">
                <i class="fas fa-receipt text-blue"></i>
                Imprimir factura (Ticket)
            </a>

            <div class="dropdown-divider"></div>

            <!-- RECIBOS -->
            <div class="menu-title">
                <i class="fas fa-cash-register"></i>
                Recibos
            </div>

            <a class="dropdown-item" href="#">
                <i class="fas fa-print text-green"></i>
                Imprimir recibo (Ticket)
            </a>

            <a class="dropdown-item" href="#">
                <i class="fas fa-file-alt text-gray"></i>
                Imprimir recibo (Hoja carta)
            </a>

            <div class="dropdown-divider"></div>

            <!-- CONSULTA -->
            <div class="menu-title">
                <i class="fas fa-search"></i>
                Consulta
            </div>

            <a class="dropdown-item" href="#">
                <i class="fas fa-eye text-yellow"></i>
                Ver detalle de venta
            </a>

            <div class="dropdown-divider"></div>

            <!-- GESTIÓN -->
            <div class="menu-title">
                <i class="fas fa-cogs"></i>
                Gestión
            </div>

            <a class="dropdown-item" href="#">
                <i class="fas fa-ban text-red"></i>
                Anular venta
            </a>

            <a class="dropdown-item" href="#">
                <i class="fas fa-times-circle text-red"></i>
                Anular factura
            </a>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
